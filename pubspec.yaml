name: notificador
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  http: ^1.4.0
  image_picker: ^1.0.7
  mime: ^1.0.6
  http_parser: ^4.0.2
  intl: ^0.18.1
  socket_io_client: ^3.1.2
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.2.1
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/UNAvoz.png"